name: Build and Release CyberManager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $v = "${{ github.ref_name }}"
          }
          if ($v -eq "main" -or [string]::IsNullOrWhiteSpace($v)) {
            $v = "v1.0.0"
          }
          Write-Host "Determined Version: $v"
          echo "VERSION=$v" >> $env:GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Restore Dependencies
        run: dotnet restore CyberManager.slnx

      - name: Build Solution
        run: dotnet build CyberManager.slnx --configuration Release --no-restore

      - name: Publish Win-x64 Application
        run: |
          dotnet publish src/CyberManager.UI/CyberManager.UI.csproj -c Release -r win-x64 --self-contained true -o ./publish-win64

      - name: Copy Extra Assets
        shell: powershell
        run: |
          if (-not (Test-Path ./publish-win64/Assets)) {
            New-Item -ItemType Directory -Force -Path ./publish-win64/Assets | Out-Null
          }
          if (Test-Path src/CyberManager.UI/Assets/CyberManager.ico) {
            Copy-Item src/CyberManager.UI/Assets/CyberManager.ico ./publish-win64/Assets/
            Copy-Item src/CyberManager.UI/Assets/CyberManager.ico ./publish-win64/
          }

      - name: Zip Published Output (Portable)
        shell: powershell
        run: |
          Compress-Archive -Path ./publish-win64/* -DestinationPath ./CyberManager-${{ env.VERSION }}-Portable-win-x64.zip

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="${{ env.VERSION }}" CyberManager.iss

      - name: Prepare Release Notes & Scan with VirusTotal
        id: virustotal
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $installerPath = "./CyberManager-Setup-${{ env.VERSION }}.exe"
          $portablePath = "./CyberManager-${{ env.VERSION }}-Portable-win-x64.zip"

          $installerHash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash $portablePath -Algorithm SHA256).Hash.ToLower()

          Write-Host "Installer SHA256: $installerHash"
          Write-Host "Portable SHA256: $portableHash"

          if ($env:VIRUSTOTAL_API_KEY) {
            function Upload-VirusTotal($filePath, $apiKey) {
              $item = Get-Item $filePath
              $sizeMb = [Math]::Round($item.Length / 1MB, 2)
              Write-Host "Uploading $filePath ($sizeMb MB) to VirusTotal..."
              $headers = @{ "x-apikey" = $apiKey }
              $url = "https://www.virustotal.com/api/v3/files"

              if ($item.Length -gt 30MB) {
                Write-Host "File exceeds 30MB ($sizeMb MB), requesting dedicated large-file upload endpoint from VirusTotal..."
                $urlResp = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Method Get -Headers $headers -TimeoutSec 60
                $url = $urlResp.data
                Write-Host "Using dedicated endpoint: $url"
              }

              $resp = & curl.exe -s -S --fail -X POST -H "x-apikey: $apiKey" -F "file=@$filePath" "$url"
              Write-Host "Upload successful. Response: $resp"
            }

            try {
              Upload-VirusTotal $installerPath $env:VIRUSTOTAL_API_KEY
            } catch {
              Write-Warning "VirusTotal installer upload warning: $_"
            }

            try {
              Upload-VirusTotal $portablePath $env:VIRUSTOTAL_API_KEY
            } catch {
              Write-Warning "VirusTotal portable upload warning: $_"
            }
          } else {
            Write-Host "VIRUSTOTAL_API_KEY secret not found; skipping direct upload and using computed SHA256 hashes for reports."
          }

          $template = [System.IO.File]::ReadAllText(".github/release-template.md", [System.Text.Encoding]::UTF8)
          $notes = $template.Replace("{{VERSION}}", "${{ env.VERSION }}").Replace("{{INSTALLER_HASH}}", $installerHash).Replace("{{PORTABLE_HASH}}", $portableHash)
          [System.IO.File]::WriteAllText("release_notes.md", $notes, [System.Text.Encoding]::UTF8)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "CyberManager ${{ env.VERSION }}"
          files: |
            ./CyberManager-${{ env.VERSION }}-Portable-win-x64.zip
            ./CyberManager-Setup-${{ env.VERSION }}.exe
          draft: true
          prerelease: false
          body_path: ./release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
